const RHO_TABLE = [[300,2.4e-11],[400,2.8e-12],[500,5.2e-13],[600,1.4e-13],[700,4.5e-14],
                   [800,1.8e-14],[900,8.0e-15],[1000,4.0e-15],[1100,2.2e-15],[1200,1.3e-15]];
const rhoAt = (h) => {
  if (h <= RHO_TABLE[0][0]) return RHO_TABLE[0][1];
  const last = RHO_TABLE[RHO_TABLE.length - 1];
  if (h >= last[0]) return last[1];
  for (let i = 0; i < RHO_TABLE.length - 1; i++) {
    const [h0, r0] = RHO_TABLE[i], [h1, r1] = RHO_TABLE[i + 1];
    if (h >= h0 && h <= h1) {
      const t = (h - h0) / (h1 - h0);
      return Math.exp(Math.log(r0) + t * (Math.log(r1) - Math.log(r0)));
    }
  }
  return last[1];
};

/* ── 포맷 ─────────────────────────────────────────────────── */
const fmt = (n, d = 1) => {
  if (!isFinite(n)) return "—";
  if (Math.abs(n) >= 1e4) return Math.round(n).toLocaleString("ko-KR");
  return n.toLocaleString("ko-KR", { minimumFractionDigits: d, maximumFractionDigits: d });
};
const kW = (w, d = 1) => (Math.abs(w) >= 1e6 ? fmt(w / 1e6, 2) + " MW" : fmt(w / 1000, d) + " kW");
const bw = (b) => {
  if (!isFinite(b) || b <= 0) return "0";
  if (b >= 1e12) return fmt(b / 1e12, 2) + " Tbps";
  if (b >= 1e9) return fmt(b / 1e9, 2) + " Gbps";
  if (b >= 1e6) return fmt(b / 1e6, 1) + " Mbps";
  return fmt(b / 1e3, 1) + " kbps";
};
const flops = (pf) => (pf >= 1e6 ? fmt(pf / 1e6, 2) + " ZFLOPS" : pf >= 1000 ? fmt(pf / 1000, 2) + " EFLOPS" : fmt(pf, 1) + " PFLOPS");
const users = (n) => (n >= 1e9 ? fmt(n / 1e9, 2) + "십억 명" : n >= 1e6 ? fmt(n / 1e6, 2) + "백만 명" : fmt(n, 0) + " 명");

   면적 가정: 어레이 날개 2장(가로:세로 4:1), 방열판 2장(세로:가로 3:1, 궤도면 평행) */
const SatDiagram = ({ geo, comp, islRate, islOk }) => {
  const { saA, radA, busS, wingW, wingH, radW, radH, gap, spanM, heightM } = geo;
  const W = 660, H = 400, PAD = 52;
  const s = Math.min((W - 2 * PAD) / spanM, (H - 2 * PAD) / heightM);
  const cx = W / 2, cy = H / 2 + 6;
  const bs = busS * s;
  const bd = Math.max(bs, 16); // 본체 최소 표시 크기 — 실축척이면 점이 되어 보이지 않음
  const gp = Math.max(gap * s, 6);

  /* 축척 막대: 40~130px 사이가 되는 보기 좋은 길이 */
  const scaleLen = [1, 2, 5, 10, 20, 50, 100, 200].find((L) => L * s >= 40 && L * s <= 130) || 10;
  const ai1Half = 35 * s; // AI1 윙스팬 70 m 비교 마커

  const wingY = cy - (wingH * s) / 2;
  const isl = [
    { x: cx - bd / 2 - 13, y: cy - 4, dx: -9, dy: 0, c: C.hot },   // SDC 링 전방
    { x: cx + bd / 2 + 5,  y: cy - 4, dx: 9,  dy: 0, c: C.hot },   // SDC 링 후방
    { x: cx - bd / 2 - 15, y: cy - bd / 2 - 15, dx: -7, dy: -7, c: C.comm }, // 릴레이 주 (상방 대각)
    { x: cx + bd / 2 + 7,  y: cy - bd / 2 - 15, dx: 7,  dy: -7, c: C.comm }, // 릴레이 예비
  ];

  return (
    <div>
      <svg viewBox={`0 0 ${W} ${H}`} style={{ width: "100%", background: C.panelAlt, border: `1px solid ${C.rule}` }}>
        {/* AI1 윙스팬 70 m 비교 마커 */}
        <line x1={cx - ai1Half} y1={H - 26} x2={cx + ai1Half} y2={H - 26} stroke={C.ink3} strokeDasharray="5 4" strokeWidth={1} />
        <line x1={cx - ai1Half} y1={H - 31} x2={cx - ai1Half} y2={H - 21} stroke={C.ink3} strokeWidth={1} />
        <line x1={cx + ai1Half} y1={H - 31} x2={cx + ai1Half} y2={H - 21} stroke={C.ink3} strokeWidth={1} />
        <text x={cx} y={H - 33} textAnchor="middle" style={{ font: `9px ${MONO}`, fill: C.ink3 }}>AI1 윙스팬 70 m (비교)</text>

        {/* 태양전지판 날개 2장 */}
        {saA > 0 && (
          <>
            <rect x={cx - bd / 2 - gp - wingW * s} y={wingY} width={wingW * s} height={wingH * s}
              fill={C.power} opacity={0.82} stroke={C.ink} strokeWidth={0.8} />
            <rect x={cx + bd / 2 + gp} y={wingY} width={wingW * s} height={wingH * s}
              fill={C.power} opacity={0.82} stroke={C.ink} strokeWidth={0.8} />
            {/* 셀 분할선 */}
            {[0.25, 0.5, 0.75].map((f, i) => (
              <React.Fragment key={i}>
                <line x1={cx - bd / 2 - gp - wingW * s * f} y1={wingY} x2={cx - bd / 2 - gp - wingW * s * f} y2={wingY + wingH * s} stroke="#fff" strokeWidth={0.6} opacity={0.5} />
                <line x1={cx + bd / 2 + gp + wingW * s * f} y1={wingY} x2={cx + bd / 2 + gp + wingW * s * f} y2={wingY + wingH * s} stroke="#fff" strokeWidth={0.6} opacity={0.5} />
              </React.Fragment>
            ))}
            <text x={cx - bd / 2 - gp - (wingW * s) / 2} y={wingY - 7} textAnchor="middle" style={{ font: `10px ${MONO}`, fill: C.power, fontWeight: 700 }}>
              태양전지판 {fmt(saA, 0)} m²
            </text>
            <text x={cx - bd / 2 - gp - (wingW * s) / 2} y={wingY + wingH * s + 13} textAnchor="middle" style={{ font: `9px ${MONO}`, fill: C.ink3 }}>
              날개 {fmt(wingW, 0)} × {fmt(wingH, 0)} m × 2장 · 총 스팬 {fmt(spanM, 0)} m
            </text>
          </>
        )}

        {/* 방열판 2장 (상·하, 궤도면 평행) */}
        {radA > 0 && (
          <>
            <rect x={cx - (radW * s) / 2} y={cy - bd / 2 - gp - radH * s} width={radW * s} height={radH * s}
              fill={C.hot} opacity={0.55} stroke={C.ink} strokeWidth={0.8} />
            <rect x={cx - (radW * s) / 2} y={cy + bd / 2 + gp} width={radW * s} height={radH * s}
              fill={C.hot} opacity={0.55} stroke={C.ink} strokeWidth={0.8} />
            <text x={cx + (radW * s) / 2 + 8} y={cy + bd / 2 + gp + (radH * s) / 2} style={{ font: `10px ${MONO}`, fill: C.hot, fontWeight: 700 }}>
              방열판 {fmt(radA, 0)} m²
            </text>
            <text x={cx + (radW * s) / 2 + 8} y={cy + bd / 2 + gp + (radH * s) / 2 + 13} style={{ font: `9px ${MONO}`, fill: C.ink3 }}>
              {fmt(radW, 0)} × {fmt(radH, 0)} m × 2장
            </text>
          </>
        )}

        {/* 컴퓨트 본체 */}
        <rect x={cx - bd / 2} y={cy - bd / 2} width={bd} height={bd} fill={C.compute} stroke={C.ink} strokeWidth={1.2} />
        <text x={cx} y={cy + bd / 2 + gp + (radA > 0 ? radH * s : 0) + 16} textAnchor="middle" style={{ font: `10px ${MONO}`, fill: C.compute, fontWeight: 700 }}>
          컴퓨트 {kW(comp.pCompCBE)} · 본체 ~{fmt(busS, 1)} m{bd > bs + 0.1 ? " (본체·ISL 확대 표시)" : ""}
        </text>

        {/* ISL 터미널 4기 */}
        {isl.map((t, i) => (
          <g key={i}>
            <rect x={t.x} y={t.y} width={8} height={8} fill={islOk ? t.c : C.warn} stroke={C.ink} strokeWidth={0.7} />
            <line x1={t.x + 4 + t.dx * 0.7} y1={t.y + 4 + t.dy * 0.7} x2={t.x + 4 + t.dx * 2.2} y2={t.y + 4 + t.dy * 2.2}
              stroke={islOk ? t.c : C.warn} strokeWidth={1.4} />
          </g>
        ))}
        <text x={cx} y={cy - bd / 2 - gp - (radA > 0 ? radH * s : 0) - 10} textAnchor="middle" style={{ font: `10px ${MONO}`, fill: C.comm, fontWeight: 700 }}>
          ISL 4기 × {islRate} Gbps (릴레이행 2 ↑ 오프로딩 · 링 2 ←→ 학습·관측)
        </text>

        {/* 축척 막대 */}
        <line x1={PAD} y1={H - 26} x2={PAD + scaleLen * s} y2={H - 26} stroke={C.ink} strokeWidth={1.5} />
        <line x1={PAD} y1={H - 31} x2={PAD} y2={H - 21} stroke={C.ink} strokeWidth={1.5} />
        <line x1={PAD + scaleLen * s} y1={H - 31} x2={PAD + scaleLen * s} y2={H - 21} stroke={C.ink} strokeWidth={1.5} />
        <text x={PAD + (scaleLen * s) / 2} y={H - 33} textAnchor="middle" style={{ font: `9px ${MONO}`, fill: C.ink }}>{scaleLen} m</text>
      </svg>
    </div>
  );
};

  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) { /* 무시 */ }
  document.body.removeChild(ta);
};

/* ══════════════════════════════════════════════════════════ */
function SDCServiceCommSimulator() {
  /* ① 위성에 싣는 컴퓨터 */
  const [designMode, setDesignMode] = useState("spec"); // unit=부품 기반 · spec=제원 기반
  const [unitKey, setUnitKey] = useState("kyber");
  const [nUnits, setNUnits] = useState(1);
  const [specKW, setSpecKW] = useState(120);
  const [specTfPerW, setSpecTfPerW] = useState(6);
  const [specHbmTB, setSpecHbmTB] = useState(20);
  const [specUnit, setSpecUnit] = useState(null); // 제원 모드에서 마지막으로 불러온 부품 프리셋
  const [compMargin100, setCompMargin100] = useState(false);
  const [hostOh, setHostOh] = useState(20);
  const [radLoss, setRadLoss] = useState(15);
  const [pCap, setPCap] = useState(100);
  const [betaKey, setBetaKey] = useState("balanced");

  /* ② 어떤 AI 서비스를 얼마나 */
  const [modelKey, setModelKey] = useState("kimi25");
  const [customTotal, setCustomTotal] = useState(2000);
  const [customAct, setCustomAct] = useState(60);
  const [inOut, setInOut] = useState(4);
  const [ctxK, setCtxK] = useState(32);
  const [tokPerUser, setTokPerUser] = useState(8000);
  const [fillKey, setFillKey] = useState("batch");
  const [clusterG, setClusterG] = useState(8);
  const [eoIntensity, setEoIntensity] = useState(1000); // kFLOP/byte
  const [mfuPct, setMfuPct] = useState(40);
  const [kvPerTok, setKvPerTok] = useState(30);
  const [sessTokS, setSessTokS] = useState(40);
  const [peakRatio, setPeakRatio] = useState(3);
  /* 서비스 통신 유형: 텍스트는 기본, 인터넷·멀티미디어는 선택 (출력 1K토큰당 KB) */
  const [webOn, setWebOn] = useState(true);
  const [webKBper1k, setWebKBper1k] = useState(200); // 인터넷 검색·브라우징 유입 (원문 페이지 등)
  const [mmOn, setMmOn] = useState(true);
  const [mmKBper1k, setMmKBper1k] = useState(100);   // 이미지 등 멀티미디어 산출물 하향

  /* ③ 통신 — ISL 4터미널 기준 설계 */
  const [islRate, setIslRate] = useState(10);        // 터미널 1기 속도 Gbps (일반 상용 10 G급)
  const [islTargetPct, setIslTargetPct] = useState(70);
  const [relayCap, setRelayCap] = useState(10);      // 릴레이 위성 1기 용량 Gbps
  const [relayEffPct, setRelayEffPct] = useState(70);
  const [relayLinks, setRelayLinks] = useState(2);       // 릴레이행 ISL 2기 중 동시 사용 링크 수
  const [relayIslPorts, setRelayIslPorts] = useState(4); // 릴레이 위성 1기가 수용하는 SDC 링크 수
  const [protoOh, setProtoOh] = useState(3);
  const [ttcMbps, setTtcMbps] = useState(2);

  /* ④ 성좌 — 궤도면 수 × 궤도면당 위성 수 */
  const [nPlanes, setNPlanes] = useState(1);
  const [satsPerPlane, setSatsPerPlane] = useState(1000);
  const [launcherKey, setLauncherKey] = useState("ss");

  /* ⑤ 참고 가정 */
  const [phase, setPhase] = useState("preA");
  const [orbitType, setOrbitType] = useState("ddsso");
  const [alt, setAlt] = useState(1000);
  const [betaAng, setBetaAng] = useState(62);
  const [solarAct, setSolarAct] = useState("mean");
  const [life, setLife] = useState(5);
  const [shedLoad, setShedLoad] = useState(false);
  const [alphaVF, setAlphaVF] = useState(2.6);
  const [staticFrac, setStaticFrac] = useState(30);
  const [cellEff, setCellEff] = useState(30);
  const [inherentDeg, setInherentDeg] = useState(77);
  const [degPerYr, setDegPerYr] = useState(2.75);
  const [incAng, setIncAng] = useState(15);
  const [saWkg, setSaWkg] = useState(200);
  const [xd, setXd] = useState(85);
  const [xe, setXe] = useState(65);
  const [dod, setDod] = useState(25);
  const [battWhKg, setBattWhKg] = useState(180);
  const [pcduEff, setPcduEff] = useState(93);
  const [aocsBase, setAocsBase] = useState(300);
  const [aocsPerM2, setAocsPerM2] = useState(1.2);
  const [obdhW, setObdhW] = useState(600);
  const [radT, setRadT] = useState(40);
  const [emis, setEmis] = useState(85);
  const [absorp, setAbsorp] = useState(12);
  const [radAtt, setRadAtt] = useState("edge");
  const [finEff, setFinEff] = useState(85);
  const [radKgM2, setRadKgM2] = useState(5);
  const [projFrac, setProjFrac] = useState(25);
  const [skDv, setSkDv] = useState(30);

  const U = UNITS[unitKey];
  const isRack = U.g === "rack";
  const uL = isRack ? "랙" : "기";
  const P = PHASES[phase];
  const nSats = nPlanes * satsPerPlane;

  /* ── 전력 캡 → 유닛당 실효 전력·성능 ───────────────────── */
  const dv = useMemo(() => {
    const s0 = staticFrac / 100, b = BETAS[betaKey].b;
    const floor = Math.ceil(s0 * 100) + 1;
    const c = Math.max(pCap, floor) / 100;
    const x = Math.pow(Math.max(0, (c - s0) / (1 - s0)), 1 / alphaVF);
    const perf = Math.pow(x, b);
    return { c, perf, floor, effW: U.w * c, effPF: U.pf8 * perf,
      tfPerW: U.w * c > 0 ? (U.pf8 * perf * 1000) / (U.w * c) : 0, gain: perf / c };
  }, [U, pCap, alphaVF, staticFrac, betaKey]);

  /* ── 궤도 (⑤ 참고 산출용) ──────────────────────────────── */
  const orb = useMemo(() => {
    const a = RE + alt;
    const T = (2 * Math.PI * Math.sqrt((a * a * a) / MU)) / 60;
    const rhoAng = Math.asin(RE / a);
    const b = (betaAng * Math.PI) / 180;
    let fE = 0;
    if (Math.abs(b) < rhoAng) {
      const num = Math.sqrt(alt * alt + 2 * RE * alt);
      fE = (1 / Math.PI) * Math.acos(Math.min(1, num / (a * Math.cos(b))));
    }
    const Te = fE * T, Td = T - Te;
    const V = Math.sqrt(MU / a) * 1000;
    const rp = RE + 100;
    const deorbitDv = V * (1 - Math.sqrt((2 * rp) / (a + rp)));
    return { T, Te, Td, fE, sunFrac: Td / T, V, deorbitDv,
      rho: rhoAt(alt) * SOLAR_ACT[solarAct].f };
  }, [alt, betaAng, solarAct]);

  /* ── ① 컴퓨트 자원 총량 ────────────────────────────────── */
  const comp = useMemo(() => {
    const isSpec = designMode === "spec";
    const duty = shedLoad ? orb.sunFrac : 1;
    /* spec 모드: 페이로드 전력 × 와트당 성능으로 역산 (전력 캡·오버헤드는 효율값에 포함 간주) */
    const peakPF = isSpec ? specKW * specTfPerW : nUnits * dv.effPF;
    const effPF = peakPF * (1 - radLoss / 100) * duty;
    const servedPF = compMargin100 ? effPF / 2 : effPF;
    const pCompCBE = isSpec ? specKW * 1000 : nUnits * dv.effW * (1 + hostOh / 100);
    return { isSpec, duty, peakPF, effPF, servedPF, pCompCBE,
      hbmTB: isSpec ? specHbmTB : (nUnits * U.hbm) / 1000,
      label: isSpec ? `컴퓨트 페이로드 (제원 ${specKW} kW)` : `컴퓨트 페이로드 (${nUnits} ${uL})`,
      payloadMass: isSpec ? specKW * 5 : nUnits * (U.mass + U.chassis) }; // 제원 모드는 5 kg/kW 추정
  }, [U, uL, nUnits, dv, radLoss, compMargin100, hostOh, shedLoad, orb.sunFrac,
      designMode, specKW, specTfPerW, specHbmTB]);

  /* ── ② 서비스: 활용률 · 채우기 ─────────────────────────── */
  const svc = useMemo(() => {
    const hbmGB = comp.hbmTB * 1000;
    const BPP = 1; // FP8 1 byte/param
    const base = MODELS[modelKey];
    const total = modelKey === "custom" ? customTotal : base.total;
    const act = modelKey === "custom" ? customAct : base.act;
    const weightsGB = total * BPP;
    const fits = weightsGB * 1.15 <= hbmGB;
    const kvFreeGB = Math.max(0, hbmGB - weightsGB * 1.15);
    const kvSessGB = (ctxK * 1000 * kvPerTok) / 1e6; // K토큰 × kB/토큰 → GB

    const Cs = comp.servedPF * 1e15 * (mfuPct / 100);
    const flopsPerTok = 2 * act * 1e9 * (1 + inOut); // 프리필 포함
    const tokSMax = fits && flopsPerTok > 0 ? Cs / flopsPerTok : 0;

    const concCompute = sessTokS > 0 ? tokSMax / sessTokS : 0;
    const concMem = kvSessGB > 0 ? kvFreeGB / kvSessGB : 0;
    const conc = Math.min(concCompute, concMem);
    const bound = concCompute <= concMem ? "연산" : "메모리";

    const rtTokS = conc * sessTokS;
    const rtFrac = tokSMax > 0 ? Math.min(1, rtTokS / tokSMax) : 0;
    const leftFrac = fits ? Math.max(0, 1 - rtFrac) : 1;
    const leftCs = Cs * leftFrac;

    /* 남는 연산 채우기 */
    let fill = { tokS: 0, islIn: 0, dlExtra: 0, used: 0, note: "" };
    if (fillKey === "batch" && fits && leftCs > 0) {
      fill.tokS = leftCs / flopsPerTok;
      fill.used = leftFrac;
      fill.note = `배치 추론 ${fmt(fill.tokS, 0)} tok/s 추가 처리`;
    } else if (fillKey === "train" && leftCs > 0) {
      const actP = act * 1e9, totalP = total * 1e9;
      const tStep = (6 * actP * 16e6) / (clusterG * leftCs);
      const bpn = 2 * ((clusterG - 1) / clusterG) * totalP * 2 * 0.25;
      fill.islIn = tStep > 0 ? (bpn * 8) / tStep : 0;
      fill.dlExtra = tStep > 0 ? ((totalP * 2) / (1000 * tStep)) * 8 : 0;
      fill.used = leftFrac;
      fill.note = `SDC ${clusterG}기 묶음 학습 — 스텝 ${fmt(tStep, 1)} s, all-reduce가 링 ISL 지배`;
    } else if (fillKey === "eo" && leftCs > 0) {
      const ingest = (leftCs / (eoIntensity * 1000)) * 8;
      fill.islIn = ingest;
      fill.dlExtra = ingest / 100;
      fill.used = leftFrac;
      fill.note = `원시 데이터 ${bw(ingest)} 흡수, 산출물 1/100 하향`;
    }
    const usedFrac = Math.min(1, rtFrac + fill.used);
    const dailyTok = (rtTokS * 86400) / peakRatio;
    const dau = tokPerUser > 0 ? dailyTok / tokPerUser : 0;

    const ladder = Object.entries(MODELS).filter(([k]) => k !== "custom").map(([k, m]) => ({
      k, ...m, ok: m.total * BPP * 1.15 <= hbmGB,
    }));

    return { hbmGB, total, act, weightsGB, fits, kvFreeGB, kvSessGB,
      Cs, flopsPerTok, tokSMax, concCompute, concMem, conc, bound,
      rtTokS, rtFrac, leftFrac, leftCs, fill, usedFrac, dailyTok, dau, ladder,
      name: base.name, tier: base.tier, est: base.est };
  }, [comp, modelKey, customTotal, customAct, mfuPct, inOut, ctxK, kvPerTok,
      sessTokS, peakRatio, tokPerUser, fillKey, clusterG, eoIntensity]);

  /* ── ③ 통신: 고정 4터미널 (SDC 링 전·후 2 + 릴레이 주·예비 2) ── */
  const cm = useMemo(() => {
    const B = 3 * 8; // 토큰당 3 byte
    const rtDl = svc.rtTokS * B * protoOh;
    const rtUl = svc.rtTokS * inOut * B * protoOh;
    const batchDl = svc.fill.tokS * B * protoOh;
    const batchUl = svc.fill.tokS * inOut * B * protoOh;
    const tokBps = rtDl + rtUl + batchDl + batchUl;                    // 텍스트 토큰 자체
    /* 에이전트 추가 트래픽: 웹 검색 유입(지상→SDC) · 멀티미디어 출력(SDC→지상) — 둘 다 릴레이 링크를 지남 */
    const webK = webOn ? webKBper1k : 0, mmK = mmOn ? mmKBper1k : 0;
    const webBps = (svc.rtTokS / 1000) * webK * 1e3 * 8;
    const mmBps = (svc.rtTokS / 1000) * mmK * 1e3 * 8;
    const feeder = tokBps + webBps + mmBps + svc.fill.dlExtra;         // 릴레이 경유 지상행
    const inter = svc.fill.islIn;                                      // SDC 링(학습·관측)
    const totalNeed = feeder + inter;

    const islCapEach = islRate * 1e9 * (islTargetPct / 100);
    const nIslTotal = 4;
    /* 오프로딩(지상행)은 릴레이행 2기 중 동시 사용 가능한 링크(relayLinks)가 전담 — 링 2기는 학습·관측 전용 */
    const feederCap = relayLinks * islCapEach;
    const interCap = 2 * islCapEach;   // SDC 링 전·후 2회선
    const feederOk = feeder <= feederCap;
    const interOk = inter <= interCap;
    /* 현 트래픽을 4터미널 구성으로 감당하기 위한 터미널 최소 속도 */
    const reqRate = Math.max(feeder / relayLinks / (islTargetPct / 100), inter / 2 / (islTargetPct / 100)) / 1e9;

    const relayEffCap = relayCap * 1e9 * (relayEffPct / 100);
    const relaysPerSat = relayEffCap > 0 ? feeder / relayEffCap : Infinity;
    const satsPerRelay = feeder > 0 ? relayEffCap / feeder : Infinity;

    /* 요약용 가정 사슬: 세션 1개·사용자 1인이 만드는 트래픽 */
    const perSessBps = svc.conc > 0 ? (rtDl + rtUl) / svc.conc : 0;
    const perUserDayMB = (tokPerUser * (1 + inOut) * 3 * protoOh + tokPerUser * (webK + mmK)) / 1e6;

    return { rtDl, rtUl, batchDl, batchUl, tokBps, webBps, mmBps, feeder, inter, totalNeed,
      islCapEach, nIslTotal, feederCap, interCap, feederOk, interOk, reqRate,
      relayEffCap, relaysPerSat, satsPerRelay, perSessBps, perUserDayMB,
      ttc: ttcMbps * 1e6 };
  }, [svc, inOut, protoOh, islRate, islTargetPct, relayCap, relayEffPct, relayLinks, ttcMbps, tokPerUser, webOn, webKBper1k, mmOn, mmKBper1k]);

  /* ── 환경 열유속 · 어레이 (⑤) ──────────────────────────── */
  const env = useMemo(() => {
    const Fe = Math.pow(RE / (RE + alt), 2) * RAD_ATT[radAtt].fF;
    const Tr = radT + 273.15, e = emis / 100, a2 = absorp / 100;
    const emit = 2 * e * SB * Math.pow(Tr, 4);
    const net = (emit - e * Q_IR * Fe - a2 * S_SOLAR * ALBEDO * Fe
      - (RAD_ATT[radAtt].sun ? a2 * S_SOLAR : 0)) * (finEff / 100);
    return { Fe, emit, net, sunLit: RAD_ATT[radAtt].sun };
  }, [alt, radAtt, radT, emis, absorp, finEff]);

  const arr = useMemo(() => {
    const eol = Math.pow(1 - degPerYr / 100, life);
    return { eol, wPerM2: S_SOLAR * (cellEff / 100) * (inherentDeg / 100) * Math.cos((incAng * Math.PI) / 180) * eol };
  }, [degPerYr, life, cellEff, inherentDeg, incAng]);

  /* ── ⑤ 전력 예산 ───────────────────────────────────────── */
  const pw = useMemo(() => {
    const pIslEach = 60 + 0.04 * islRate;
    const pCommCBE = cm.nIslTotal * pIslEach + 120; // 광 ISL 4기 + TT&C RF 120 W
    const rough = (comp.pCompCBE + pCommCBE) * 1.55;
    const approxArea = (env.net > 0 ? rough / env.net : 0) + (arr.wPerM2 > 0 ? rough / arr.wPerM2 : 0);
    const aocsW = aocsBase + aocsPerM2 * approxArea;
    const pTcsCBE = (comp.pCompCBE + pCommCBE + aocsW) * 0.035;

    const items = [
      { k: comp.label, cbe: comp.pCompCBE, m: P.eqD, strong: true },
      { k: `통신 (ISL ${cm.nIslTotal}기 + TT&C RF)`, cbe: pCommCBE, m: P.eqD },
      { k: "열제어", cbe: pTcsCBE, m: P.eqD },
      { k: "자세·궤도제어 (AOCS)", cbe: aocsW, m: P.eqC },
      { k: "탑재컴퓨터·TT&C (OBDH)", cbe: obdhW, m: P.eqAB },
    ].map((r) => ({ ...r, mev: r.cbe * (1 + r.m / 100) }));

    const cbeSum = items.reduce((s, r) => s + r.cbe, 0);
    const mevSum = items.reduce((s, r) => s + r.mev, 0);
    const withSys = mevSum * (1 + P.sys / 100);
    const busInput = withSys / (pcduEff / 100);
    const Pe = shedLoad ? busInput * 0.12 : busInput;
    const Psa = (Pe * orb.Te / (xe / 100) + busInput * orb.Td / (xd / 100)) / orb.Td;
    const saArea = Psa / arr.wPerM2;
    const saMass = Psa / saWkg;
    const battWh = (Pe * (orb.Te / 60)) / ((dod / 100) * 0.9);
    const battMass = battWh / battWhKg;
    return { items, cbeSum, mevSum, withSys, busInput, Psa, saArea, saMass,
      battWh, battMass, pCommCBE, pTcsCBE, aocsW };
  }, [comp, cm.nIslTotal, islRate, P, obdhW, pcduEff, shedLoad,
      orb, arr, env, xe, xd, saWkg, dod, battWhKg, aocsBase, aocsPerM2]);

  /* ── ⑤ 열·질량 ─────────────────────────────────────────── */
  const th = useMemo(() => {
    const Q = pw.busInput;
    const area = env.net > 0 ? Q / env.net : Infinity;
    return { Q, area, mass: area * radKgM2, loopMass: (Q / 1000) * 3.0 };
  }, [pw.busInput, env, radKgM2]);

  const ms = useMemo(() => {
    const eq = [
      { k: comp.label, cbe: comp.payloadMass, m: P.eqD, strong: true },
      { k: "방열판·유체루프", cbe: th.mass + th.loopMass, m: P.eqD },
      { k: "태양전지판", cbe: pw.saMass, m: P.eqC },
      { k: "배터리", cbe: pw.battMass, m: P.eqAB },
      { k: "PCDU·전력전자", cbe: (pw.Psa / 1000) * 3.0, m: P.eqC },
      { k: `통신 (ISL ${cm.nIslTotal}기 + TT&C)`, cbe: cm.nIslTotal * 12 + 20, m: P.eqC },
      { k: "AOCS·OBDH", cbe: 65 + (pw.Psa / 1000) * 0.9, m: P.eqC },
      { k: "추진 (건조)", cbe: 30 + (pw.Psa / 1000) * 0.5, m: P.eqC },
    ].map((r) => ({ ...r, mev: r.cbe * (1 + r.m / 100) }));
    const eqCBE = eq.reduce((s, r) => s + r.cbe, 0);
    const eqMEV = eq.reduce((s, r) => s + r.mev, 0);
    const harness = eqMEV * 0.05, struct = (eqMEV + harness) * 0.25;
    const dry = (eqMEV + harness + struct) * (1 + P.sys / 100);
    const deployed = th.area + pw.saArea;
    const Aproj = deployed * (projFrac / 100);
    const accel = (0.5 * orb.rho * orb.V * orb.V * 2.2 * Aproj) / dry;
    const dragDvYr = accel * 3.156e7;
    const dV = dragDvYr * life + orb.deorbitDv + skDv;
    const prop = dry * (Math.exp(dV / (1600 * 9.80665)) - 1) * 1.02;
    return { eq, eqCBE, eqMEV, harness, struct, dry, prop, wet: dry + prop,
      dV, dragDvYr, deployed, Aproj };
  }, [comp, th, pw, cm.nIslTotal, P, orb, life, projFrac, skDv]);

  /* ── ④ 성좌 합계 ─────────────────────────────────────────── */
  const con = useMemo(() => {
    const L = LAUNCHERS[launcherKey];
    const per = Math.floor((L.cap * 0.9) / ms.wet);
    const launches = per >= 1 ? Math.ceil(nSats / per) : Infinity;
    const totalFeeder = cm.feeder * nSats;
    /* 릴레이 소요 — 링크·용량 결합 산식.
       SDC 1기의 지상행은 동시 링크 L개에 나뉘고(링크당 feeder/L), 링크 하나는 릴레이 간 분할 불가.
       → 릴레이 1기가 실제 수용하는 링크 = min(포트 수 P, ⌊실효용량 ÷ 링크당 트래픽⌋)
       → 필요 릴레이 = ⌈총 링크 수(SDC수 × L) ÷ 실제 수용 링크⌉ */
    const linkBps = relayLinks > 0 ? cm.feeder / relayLinks : 0;
    const portsByCap = linkBps <= 0 ? relayIslPorts
      : cm.relayEffCap > 0 ? Math.floor(cm.relayEffCap / linkBps) : 0;
    const portsEff = Math.max(0, Math.min(relayIslPorts, portsByCap));
    const linkFeasible = linkBps <= 0 || portsByCap >= 1;
    const relayTotal = linkFeasible && portsEff > 0 ? Math.ceil((nSats * relayLinks) / portsEff) : Infinity;
    const relayBind = !linkFeasible ? "링크 과부하" : portsEff >= relayIslPorts ? "링크 수" : "용량";
    return {
      totalPF: comp.servedPF * nSats,
      totalMW: (pw.Psa * nSats) / 1e6,
      totalT: (ms.wet * nSats) / 1000,
      totalDau: svc.dau * nSats,
      totalFeeder, linkBps, portsByCap, portsEff, linkFeasible, relayTotal, relayBind,
      per, launches, cost: per >= 1 ? (launches * L.cost) / 1000 : Infinity, L,
    };
  }, [comp, pw, ms, svc, cm, nSats, relayLinks, relayIslPorts, launcherKey]);

  /* ── 위성 형상 기하 (m) — SatDiagram과 형상 패널이 공유 ── */
  const geo = useMemo(() => {
    const saA = isFinite(pw.saArea) && pw.saArea > 0 ? pw.saArea : 0;
    const radA = isFinite(th.area) && th.area > 0 ? th.area : 0;
    const busS = Math.max(1.5, Math.cbrt(Math.max(comp.payloadMass, 100) / 200)); // 밀도 200 kg/m³ 가정
    const wingH = saA > 0 ? Math.sqrt(saA / 8) : 0;   // 날개 1장 = saA/2, 폭:높이 4:1
    const wingW = 4 * wingH;
    const radW = radA > 0 ? Math.sqrt(radA / 6) : 0;  // 방열판 1장 = radA/2, 높이:폭 3:1
    const radH = 3 * radW;
    const gap = Math.max(busS * 0.4, 1);
    const spanM = 2 * (wingW + gap) + busS;
    const heightM = Math.max(2 * (radH + gap) + busS, wingH) * 1.06;
    return { saA, radA, busS, wingW, wingH, radW, radH, gap, spanM, heightM };
  }, [pw.saArea, th.area, comp.payloadMass]);

  /* 릴레이 용량별 소요 대수 곡선 */
  const relayCurve = useMemo(() => {
    return [1, 2, 5, 10, 20, 30, 50, 75, 100].map((cap) => ({
      cap,
      relays: cm.feeder > 0 ? Math.ceil((cm.feeder * nSats) / (cap * 1e9 * (relayEffPct / 100))) : 0,
    }));
  }, [cm.feeder, nSats, relayEffPct]);

  /* 컴퓨트 활용 밴드 (%) */
  const utilSegs = [
    { label: "실시간 추론", v: svc.rtFrac * 100, c: C.compute },
    { label: FILLS[fillKey].name.split(" ")[0], v: svc.fill.used * 100, c: fillKey === "none" ? C.idle : C.computeLt },
    { label: "유휴", v: Math.max(0, 100 - svc.usedFrac * 100), c: C.idle },
  ];
  /* 트래픽 밴드 (Gbps) */
  const trafSegs = [
    { label: "토큰 상·하향", v: (cm.tokBps + svc.fill.dlExtra) / 1e9, c: C.comm },
    { label: "웹 유입", v: cm.webBps / 1e9, c: "#8E77AE" },
    { label: "멀티미디어", v: cm.mmBps / 1e9, c: C.power },
    { label: "SDC 링", v: cm.inter / 1e9, c: C.hot },
  ];

  const utilColor = svc.usedFrac >= 0.9 ? C.good : svc.usedFrac >= 0.6 ? C.power : C.warn;
  const islOk = cm.feederOk && cm.interOk;
  const kwPerTon = ms.wet > 0 ? (comp.pCompCBE / 1000) / (ms.wet / 1000) : 0; // AI1 비교용
  const applyAI1 = () => {
    setDesignMode("spec"); setSpecKW(120); setSpecTfPerW(AI1.est.tfPerW);
    setSpecHbmTB(AI1.est.hbmTB); setAlt(AI1.alt); setSpecUnit(null);
  };
  /* 설정·결과 요약을 텍스트로 복사 — AI에게 붙여넣어 질문하는 용도 */
  const [copied, setCopied] = useState(false);
  const copySummary = () => {
    const Ls = [
      "[SDC 시뮬레이터 v3 · 설정/결과 요약]",
      "",
      "① 컴퓨트",
      designMode === "spec"
        ? `- 제원 입력: ${specKW} kW · ${specTfPerW} TF/W · HBM ${specHbmTB} TB`
        : `- 부품: ${U.name} × ${nUnits}${uL} · 전력캡 ${Math.max(pCap, dv.floor)}% · 오버헤드 ${hostOh}%`,
      `- 방사선 감쇠 ${radLoss}% · 컴퓨팅 마진 100% ${compMargin100 ? "적용" : "미적용"}`,
      `- 결과: 서비스 가용 연산 ${flops(comp.servedPF)} · HBM ${fmt(comp.hbmTB, 1)} TB · 컴퓨트 전력 ${kW(comp.pCompCBE)}`,
      "② 서비스",
      `- 모델 ${svc.name} (총 ${svc.total}B/활성 ${svc.act}B) · MFU ${mfuPct}% · 입:출 ${inOut}:1 · 컨텍스트 ${ctxK}K · KV ${kvPerTok} kB/tok`,
      `- 세션 ${sessTokS} tok/s · 1인 ${tokPerUser} tok/일 · 피크/평균 ${peakRatio} · 프로토콜 ×${protoOh}`,
      `- 통신 유형: 텍스트${webOn ? ` + 웹 ${webKBper1k} KB/1K토큰` : ""}${mmOn ? ` + 멀티미디어 ${mmKBper1k} KB/1K토큰` : ""}`,
      `- 남는 연산 채우기: ${FILLS[fillKey].name}${fillKey === "train" ? ` (${clusterG}기 묶음)` : ""}`,
      `- 결과: 동시 ${fmt(svc.conc, 0)}세션 (${svc.bound} 제약) · DAU ${users(svc.dau)} · 활용률 ${fmt(svc.usedFrac * 100, 0)}%`,
      "③ 통신 (TT&C만 RF 직접 · 서비스 트래픽은 ISL→릴레이 LEO→지상)",
      `- ISL 4터미널 × ${islRate} Gbps (릴레이행 동시 ${relayLinks} + 링 2) · 목표점유 ${islTargetPct}% · 판정 ${islOk ? "충족" : "부족(터미널당 " + fmt(cm.reqRate, 1) + " Gbps 필요)"}`,
      `- 릴레이 위성: 용량 ${relayCap} Gbps · 실효율 ${relayEffPct}% · 포트 ${relayIslPorts}링크`,
      `- 결과: 위성 1기 지상행 ${bw(cm.feeder)} (토큰 ${bw(cm.tokBps)}${cm.webBps > 0 ? " + 웹 " + bw(cm.webBps) : ""}${cm.mmBps > 0 ? " + 멀티미디어 " + bw(cm.mmBps) : ""}) · SDC 링 ${bw(cm.inter)}`,
      `- 릴레이 산정: 링크당 ${bw(con.linkBps)} → 릴레이 1기 수용 min(${relayIslPorts}, ${fmt(con.portsByCap, 0)}) = ${fmt(con.portsEff, 0)}링크 → 필요 ${isFinite(con.relayTotal) ? fmt(con.relayTotal, 0) : "—"}기 (${con.relayBind} 제약)`,
      "④ 성좌",
      `- ${nPlanes}면 × ${satsPerPlane}기 = ${nSats.toLocaleString("ko-KR")}기 · 총 연산 ${flops(con.totalPF)} · 총 DAU ${users(con.totalDau)} · 총 지상행 ${bw(con.totalFeeder)}`,
      "⑤ 참고 산출",
      `- 발사질량 ${fmt(ms.wet / 1000, 1)} t · 태양전지판 ${fmt(pw.saArea, 0)} m² (${kW(pw.Psa)}) · 방열판 ${fmt(th.area, 0)} m² · 고도 ${alt} km · 수명 ${life}년`,
    ];
    const text = Ls.join("\n");
    const done = () => { setCopied(true); setTimeout(() => setCopied(false), 2500); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done).catch(() => { fallbackCopy(text); done(); });
    } else { fallbackCopy(text); done(); }
  };

  /* 부품 프리셋 → 제원 자동 입력: 랙은 전력까지, 모듈은 현재 전력 기준 효율·HBM 환산 */
  const loadSpecUnit = (k) => {
    const u = UNITS[k];
    setSpecUnit(k);
    const kw = u.g === "rack" ? Math.round(u.w / 1000) : specKW;
    if (u.g === "rack") setSpecKW(kw);
    setSpecTfPerW(Math.round((u.pf8 * 1000 / u.w) * 10) / 10);
    setSpecHbmTB(Math.max(1, Math.round((kw * 1000 / u.w) * (u.hbm / 1000))));
  };

  return (
    <div style={{ background: C.paper, color: C.ink, fontFamily: SANS, minHeight: "100%" }} className="p-4 sm:p-7">
      <div className="max-w-6xl mx-auto">
        <header className="mb-6">
          <Eyebrow color={C.hot}>우주 데이터센터(SDC) · 서비스 · 통신 설계 시뮬레이터 v3</Eyebrow>
          <h1 className="mt-2" style={{ fontSize: 28, fontWeight: 800, letterSpacing: "-0.03em", lineHeight: 1.14 }}>
            이 위성으로 무슨 서비스를 얼마나 할 수 있고,<br />통신은 얼마나 필요한가
          </h1>
          <p className="mt-3 max-w-3xl" style={{ fontSize: 13, color: C.ink2, lineHeight: 1.65 }}>
            각 단락의 출력이 다음 단락의 입력입니다:
            <strong> ① 컴퓨터를 싣는다 → 연산능력 · ② 서비스를 올린다 → 사용자 규모와 트래픽 ·
            ③ 트래픽을 나른다 → ISL·릴레이 소요 · ④ 곱하기 N기 → 성좌 합계</strong>.
            통신은 관제(TT&C)만 RF 직접, 서비스 트래픽은 전량 광 ISL → 저궤도 릴레이 경유입니다.
            전력·열·무게는 ⑤에서 "이 설계가 성립하는가"를 검증하는 참고 산출입니다.
          </p>
        </header>

        {/* ═══ 결과 요약 ═══ */}
        <Panel eyebrow="결과 요약" title="궁극적으로 알고 싶은 다섯 개의 숫자" accent={C.hot} style={{ marginBottom: 18 }}>
          <div className="grid gap-5" style={{ gridTemplateColumns: "repeat(auto-fit,minmax(170px,1fr))" }}>
            <Metric label="① 위성 1기 연산능력" value={flops(comp.servedPF)} big color={C.compute}
              sub={`HBM ${fmt(comp.hbmTB, 1)} TB · 마진 반영 후`} />
            <Metric label="② 서비스 규모 (1기)" value={svc.dau >= 1e6 ? fmt(svc.dau / 1e6, 2) + "M" : fmt(svc.dau, 0)} unit="DAU" big color={C.compute}
              sub={`동시 ${fmt(svc.conc, 0)}세션 · ${svc.name}`} />
            <Metric label="③ 위성 1기 통신 수요" value={bw(cm.totalNeed)} big color={C.comm}
              sub={`토큰 ${bw(cm.tokBps)}${cm.webBps > 0 ? ` + 웹 ${bw(cm.webBps)}` : ""}${cm.mmBps > 0 ? ` + 멀티미디어 ${bw(cm.mmBps)}` : ""}${cm.inter > 0 ? ` + 링 ${bw(cm.inter)}` : ""}`} />
            <Metric label="③ ISL 4터미널 판정" value={islOk ? "충족" : "부족"} big color={islOk ? C.good : C.warn}
              sub={islOk ? `${islRate} Gbps × 4기 · 오프로딩은 릴레이행 2기` : `터미널당 ${fmt(cm.reqRate, 1)} Gbps 이상 필요`} />
            <Metric label="④ 릴레이 위성 소요" value={isFinite(con.relayTotal) ? fmt(con.relayTotal, 0) + "기" : "—"} big color={C.comm}
              sub={`릴레이당 ${fmt(con.portsEff, 0)}링크 수용 (링크당 ${bw(con.linkBps)}) · ${con.relayBind} 제약`} />
          </div>
          <div className="mt-4 p-3" style={{ background: C.panelAlt, border: `1px dashed ${C.rule}` }}>
            <span style={{ fontSize: 11.5, color: C.ink2, lineHeight: 1.8 }}>
              <strong>통신 수요가 나오는 가정 사슬</strong> — 세션당 출력 {sessTokS} tok/s, 입력은 그 {fmt(inOut, 1)}배,
              토큰당 3 B, 프로토콜 오버헤드 {fmt(protoOh, 1)}배 → <strong>세션당 {bw(cm.perSessBps)}</strong>.
              × 동시 {fmt(svc.conc, 0)}세션 = 토큰 트래픽 {bw(cm.tokBps)}.
              {(cm.webBps > 0 || cm.mmBps > 0) ? (
                <> 에이전트 가산 — {cm.webBps > 0 && <>웹 유입 {webKBper1k} KB/1K토큰 = {bw(cm.webBps)}</>}
                {cm.webBps > 0 && cm.mmBps > 0 && <>, </>}
                {cm.mmBps > 0 && <>멀티미디어 {mmKBper1k} KB/1K토큰 = {bw(cm.mmBps)}</>} → </>
              ) : <> (텍스트 전용) → </>}
              <strong>위성 1기 {bw(cm.feeder)}</strong>, 성좌 {nSats.toLocaleString("ko-KR")}기 = <strong>{bw(con.totalFeeder)}</strong>.
              릴레이 산정 — 지상행이 동시 링크 {relayLinks}개에 나뉘어 <strong>링크당 {bw(con.linkBps)}</strong>.
              릴레이 1기(실효 {bw(cm.relayEffCap)} · 포트 {relayIslPorts}링크)가 실제 수용하는 링크
              = min({relayIslPorts}, ⌊용량 ÷ 링크 트래픽⌋ = {fmt(con.portsByCap, 0)}) = <strong>{fmt(con.portsEff, 0)}링크</strong>.
              총 링크 {nSats.toLocaleString("ko-KR")} × {relayLinks} ÷ {fmt(con.portsEff, 0)}
              = <strong>{isFinite(con.relayTotal) ? fmt(con.relayTotal, 0) : "—"}기 ({con.relayBind} 제약)</strong>.
              1인 기준으로는 하루 {fmt(tokPerUser * (1 + inOut), 0)}토큰 + 웹·멀티미디어 ≈ {fmt(cm.perUserDayMB, 1)} MB.
              관제(TT&C)는 별도 RF {fmt(ttcMbps, 0)} Mbps 직접 링크.
            </span>
          </div>
          <button onClick={copySummary} className="mt-3 px-4 py-2"
            style={{ background: copied ? C.good : "transparent", border: `1px solid ${copied ? C.good : C.compute}`,
              color: copied ? "#fff" : C.compute, fontFamily: MONO, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
            {copied ? "✓ 복사됨 — AI 채팅에 붙여넣어 질문하세요" : "⧉ 설정·결과 요약 복사 (AI 질문용)"}
          </button>
        </Panel>

        {/* ═══ 위성 형상 (수치 연동) ═══ */}
        <Panel eyebrow="위성 형상" title="지금 설정한 수치가 만드는 위성의 모습"
          flow="①의 컴퓨트 본체 · ③의 ISL 4기 · ⑤에서 산출된 태양전지판·방열판 면적을 실제 축척으로 — 수치를 바꾸면 형상이 바뀝니다"
          accent={C.compute} style={{ marginBottom: 18 }}>
          <div className="grid gap-6 lg:grid-cols-3">
            <div className="lg:col-span-2">
              <SatDiagram geo={geo} comp={comp} islRate={islRate} islOk={islOk} />
            </div>
            <div>
              <Row k="총 스팬 (어레이 포함)" v={fmt(geo.spanM, 0)} u="m" accent={C.power} />
              <Row k="태양전지판 날개" v={`${fmt(geo.wingW, 0)} × ${fmt(geo.wingH, 0)} m × 2장`} accent={C.power} />
              <Row k="태양전지판 면적" v={`${fmt(geo.saA, 0)} m² (${kW(pw.Psa)})`} indent dim />
              <Row k="방열판" v={`${fmt(geo.radW, 0)} × ${fmt(geo.radH, 0)} m × 2장 (${fmt(geo.radA, 0)} m²)`} accent={C.hot} />
              <Row k="컴퓨트 본체" v={`한 변 ~${fmt(geo.busS, 1)} m · ${fmt(comp.payloadMass, 0)} kg`} />
              <Row k="ISL 터미널" v={`4기 × ${islRate} Gbps`} accent={islOk ? C.good : C.warn} />
              <Row k="발사질량" v={`${fmt(ms.wet / 1000, 1)} t`} dim />
              <p className="mt-3" style={{ fontSize: 11, color: C.ink3, lineHeight: 1.6 }}>
                날개 가로:세로 4:1, 방열판 세로:가로 3:1(궤도면 평행 배치), 본체 밀도 200 kg/m³ 가정의
                개략 형상입니다. 점선은 AI1 윙스팬 70 m — 지금 설계가 AI1 대비 얼마나 큰지 한눈에 비교됩니다.
              </p>
            </div>
          </div>
        </Panel>

        {/* ═══ ① 위성에 싣는 컴퓨터 ═══ */}
        <Panel eyebrow="① 위성에 싣는 컴퓨터" title="GPU를 얼마나 올릴 것인가"
          flow="출력: 연산능력(PFLOPS)과 메모리(HBM) → ②에서 서비스 규모를 결정"
          accent={C.compute} style={{ marginBottom: 18 }}>
          <Choice label="설계 방식" cols={2} value={designMode} onChange={setDesignMode}
            options={[
              { key: "unit", label: "부품 기반", sub: "GPU/랙을 골라서 적재" },
              { key: "spec", label: "위성 제원 기반", sub: "AI1처럼 전력·효율·메모리로 역산" },
            ]} />
          <div className="grid gap-5 lg:grid-cols-3">
            <div>
              {comp.isSpec ? (
                <>
                  <Eyebrow color={C.hot}>위성 제원 직접 입력</Eyebrow>
                  <div className="mt-2">
                    <Choice label="부품 프리셋 — 선택하면 아래 제원이 자동 입력" cols={2} value={specUnit} onChange={loadSpecUnit}
                      options={Object.entries(UNITS).map(([k, u]) => ({
                        key: k, label: u.name, sub: `${(u.pf8 * 1000 / u.w).toFixed(1)} TF/W${u.g === "rack" ? ` · ${u.w / 1000} kW` : ""}` }))} />
                    <Slider label="컴퓨트 페이로드 전력" value={specKW} onChange={setSpecKW} min={10} max={1500} step={10} unit="kW"
                      hint="AI1 공개치: 평균 120 kW · 피크 150 kW" />
                    <Slider label="와트당 성능 (FP8)" value={specTfPerW} onChange={setSpecTfPerW} min={1} max={40} step={0.5} unit="TF/W" dec={1}
                      hint="GB300 랙 등가 ~6 · VR200 ~9.5 · Rubin Ultra ~8.3" />
                    <Slider label="탑재 메모리 (HBM)" value={specHbmTB} onChange={setSpecHbmTB} min={1} max={300} step={1} unit="TB" />
                    <button onClick={applyAI1} className="w-full px-3 py-2 mt-1"
                      style={{ background: "transparent", border: `1px solid ${C.hot}`, color: C.hot,
                        fontFamily: MONO, fontSize: 11.5, fontWeight: 600, cursor: "pointer" }}>
                      ⟳ AI1 제원 불러오기 (120 kW · 6 TF/W · 20 TB · 600 km)
                    </button>
                  </div>
                </>
              ) : (
                <>
                  <Eyebrow>GPU 모듈 단위</Eyebrow>
                  <div className="mt-2">
                    <Choice cols={2} value={unitKey} onChange={setUnitKey}
                      options={Object.entries(UNITS).filter(([, u]) => u.g === "module").map(([k, u]) => ({
                        key: k, label: u.name, sub: `${u.w} W · ${u.pf8} PF · HBM ${u.hbm} GB` }))} />
                  </div>
                  <Eyebrow color={C.hot}>랙 단위</Eyebrow>
                  <div className="mt-2">
                    <Choice cols={2} value={unitKey} onChange={setUnitKey}
                      options={Object.entries(UNITS).filter(([, u]) => u.g === "rack").map(([k, u]) => ({
                        key: k, label: u.name, sub: `${u.w / 1000} kW · ${u.pf8 / 1000} EF · ${(u.hbm / 1000).toFixed(0)} TB` }))} />
                  </div>
                </>
              )}
            </div>
            <div>
              {!comp.isSpec && (
                <Slider label="탑재 수량" value={nUnits} onChange={(v) => setNUnits(Math.round(v))} min={1} max={isRack ? 8 : 200} unit={uL} />
              )}
              <label className="flex items-start gap-2 mb-3 cursor-pointer">
                <input type="checkbox" checked={compMargin100} onChange={(e) => setCompMargin100(e.target.checked)} style={{ accentColor: C.compute, marginTop: 2 }} />
                <span style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.4 }}>컴퓨팅 마진 100% (ECSS 개념설계 권고)<br />
                  <span style={{ fontSize: 10.5, color: C.ink3 }}>서비스 가용 연산을 절반으로 계상</span></span>
              </label>
              <Details label="성능 세부 조정 (전력 캡 · 오버헤드 · 감쇠)">
                {!comp.isSpec && (
                  <>
                    <Slider label="전력 설정 (전력 캡)" value={Math.max(pCap, dv.floor)} onChange={setPCap} min={20} max={100} unit="% of TDP"
                      hint={`낮출수록 와트당 성능↑ (현재 ${fmt(dv.gain, 2)}배 효율). 하한 ${dv.floor}%`} />
                    <Choice label="주 워크로드 성격 (전력 캡 민감도)" cols={1} value={betaKey} onChange={setBetaKey}
                      options={Object.entries(BETAS).map(([k, v]) => ({ key: k, label: `${v.name} (β=${v.b})`, sub: v.desc }))} />
                    <Slider label="호스트·패브릭 오버헤드" value={hostOh} onChange={setHostOh} min={0} max={60} unit="%" />
                  </>
                )}
                <Slider label="방사선 대응 성능 감쇠" value={radLoss} onChange={setRadLoss} min={0} max={50} unit="%"
                  hint="ECC·재시도 등 순수 손실" />
              </Details>
            </div>
            <div className="grid grid-cols-2 gap-4 content-start">
              <Metric label="정격 성능" value={flops(comp.peakPF)} />
              <Metric label="유효 성능" value={flops(comp.effPF)} sub="전력캡·감쇠·가동률 반영" />
              <Metric label="서비스 가용 연산" value={flops(comp.servedPF)} big color={C.compute}
                sub={compMargin100 ? "마진 100% 차감 후" : "마진 미적용"} />
              <Metric label="탑재 메모리 (HBM)" value={fmt(comp.hbmTB, 1)} unit="TB" big />
              <Metric label="컴퓨트 전력" value={kW(comp.pCompCBE)} color={C.power} sub="CBE 기준" />
              <Metric label="와트당 성능" value={fmt(comp.isSpec ? specTfPerW : dv.tfPerW, 2)} unit="TF/W"
                sub={comp.isSpec ? "제원 입력값" : `전력 캡 ${Math.max(pCap, dv.floor)}% 기준`} />
            </div>
          </div>
        </Panel>

        {/* ═══ ② 어떤 AI 서비스를 얼마나 ═══ */}
        <Panel eyebrow="② 어떤 AI 서비스를 얼마나" title="모델을 고르면 연산능력의 몇 %를 쓰는지 보입니다"
          flow="입력: ①의 연산능력·메모리 → 출력: 사용자 규모(DAU)와 트래픽 발생량 → ③의 통신 수요"
          accent={C.compute} style={{ marginBottom: 18 }}>

          {/* 활용률 게이지 */}
          <div className="mb-5">
            <div className="flex items-baseline justify-between mb-1.5">
              <Eyebrow color={utilColor}>총 연산능력 대비 사용 비중</Eyebrow>
              <span style={{ fontFamily: MONO, fontSize: 16, fontWeight: 700, color: utilColor }}>{fmt(svc.usedFrac * 100, 0)}%</span>
            </div>
            <Band segments={utilSegs} total={100} unit="%" />
            {svc.fits && svc.leftFrac > 0.05 && fillKey === "none" && (
              <p className="mt-2" style={{ fontSize: 11.5, color: C.warn, lineHeight: 1.5 }}>
                연산의 {fmt(svc.leftFrac * 100, 0)}%가 놀고 있습니다 — 오른쪽 "남는 연산 채우기"를 선택하거나,
                ①의 전력 캡을 낮춰 남는 만큼 전력·방열을 줄이세요.
              </p>
            )}
          </div>

          <div className="p-4 mb-5" style={{ background: C.panelAlt, border: `1px solid ${svc.fits ? C.compute : C.warn}` }}>
            {svc.fits ? (
              <p style={{ fontSize: 13, color: C.ink, lineHeight: 1.7 }}>
                위성 1기가 <strong style={{ color: C.compute }}>{svc.name}</strong>({svc.tier}, 가중치 {fmt(svc.weightsGB, 0)} GB)를 상주시키고
                출력 <strong>{fmt(svc.rtTokS, 0)} tok/s</strong> · 동시 <strong>{fmt(svc.conc, 0)}세션</strong>({svc.bound} 제약)
                · 일일 활성 사용자 <strong style={{ color: C.compute }}>{users(svc.dau)}</strong>를 감당합니다.
                이 실시간 서비스는 가용 연산의 <strong style={{ color: utilColor }}>{fmt(svc.rtFrac * 100, 0)}%</strong>를 사용
                {svc.fill.used > 0 && <>, 남는 {fmt(svc.leftFrac * 100, 0)}%는 <strong>{FILLS[fillKey].name}</strong>으로 채웁니다 ({svc.fill.note})</>}.
              </p>
            ) : (
              <p style={{ fontSize: 13, color: C.warn, lineHeight: 1.7 }}>
                <strong>{svc.name}</strong>은 가중치만 {fmt(svc.weightsGB, 0)} GB — 탑재 HBM {fmt(svc.hbmGB, 0)} GB에 들어가지 않습니다.
                위성 여러 기 파이프라인 병렬이 필요하며 그 순간 ISL이 지배 제약이 됩니다. 탑재 수량을 늘리거나 작은 모델을 고르세요.
              </p>
            )}
          </div>

          <div className="grid gap-6 lg:grid-cols-3">
            <div>
              <div className="flex items-baseline justify-between mb-1.5">
                <span style={{ fontSize: 12.5, color: C.ink2, fontWeight: 500 }}>서비스 모델</span>
                <span style={{ fontFamily: MONO, fontSize: 10.5, color: C.ink3 }}>메모리 상한 {fmt(svc.hbmGB / 1.15, 0)} GB</span>
              </div>
              <div className="grid gap-1" style={{ gridTemplateColumns: "1fr 1fr" }}>
                {svc.ladder.map((m) => {
                  const on = m.k === modelKey;
                  const dis = !m.ok;
                  return (
                    <button key={m.k} onClick={() => !dis && setModelKey(m.k)} disabled={dis}
                      className="text-left px-2 py-1.5"
                      style={{ background: on ? C.compute : "transparent",
                        border: `1px solid ${on ? C.compute : C.rule}`,
                        color: on ? "#fff" : dis ? C.ink3 : C.ink2,
                        opacity: dis ? 0.45 : 1, fontSize: 11, lineHeight: 1.2,
                        cursor: dis ? "not-allowed" : "pointer", fontWeight: on ? 600 : 400 }}>
                      {m.name}
                      <div style={{ fontFamily: MONO, fontSize: 9, opacity: 0.75, marginTop: 1 }}>
                        {dis ? "메모리 부족" : `활성 ${m.act}B · ${m.tier}`}
                      </div>
                    </button>
                  );
                })}
                <button onClick={() => setModelKey("custom")} className="text-left px-2 py-1.5"
                  style={{ background: modelKey === "custom" ? C.compute : "transparent",
                    border: `1px solid ${modelKey === "custom" ? C.compute : C.rule}`,
                    color: modelKey === "custom" ? "#fff" : C.ink2, fontSize: 11,
                    fontWeight: modelKey === "custom" ? 600 : 400, cursor: "pointer", lineHeight: 1.2 }}>
                  직접 지정
                  <div style={{ fontFamily: MONO, fontSize: 9, opacity: 0.75, marginTop: 1 }}>총·활성 수동 입력</div>
                </button>
              </div>
              {modelKey === "custom" && (
                <div className="mt-3">
                  <Slider label="총 파라미터" value={customTotal} onChange={setCustomTotal} min={7} max={3000} unit="B" />
                  <Slider label="토큰당 활성 파라미터" value={Math.min(customAct, customTotal)} onChange={setCustomAct} min={1} max={Math.max(2, customTotal)} unit="B" />
                </div>
              )}
              {svc.est && (
                <div style={{ fontSize: 10.5, color: C.ink3, marginTop: 5 }}>· 활성 파라미터 공표치가 없는 모델은 추정값입니다</div>
              )}
            </div>
            <div>
              <Eyebrow>서비스 가정</Eyebrow>
              <div className="mt-2">

              <CmpRow k="탑재 메모리" mine={fmt(comp.hbmTB, 1) + " TB"} refV={`~${AI1.est.hbmTB} TB`} refEst />
              <CmpRow k="발사질량" mine={fmt(ms.wet / 1000, 1) + " t"} refV={`~${AI1.est.massT} t`} refEst />
              <CmpRow k="효율 (컴퓨트 kW/t)" mine={fmt(kwPerTon, 1) + " kW/t"} refV="70 kW/t"
                accent={kwPerTon >= 35 ? C.good : C.warn} />
              <CmpRow k="전개 구조" mine={fmt(ms.deployed, 0) + " m²"} refV={`${AI1.wing} (~${AI1.est.areaM2} m²)`} refEst />
              <CmpRow k="방열" mine="복사 열평형으로 산출" refV="배치형 액체 라디에이터" />
              <CmpRow k="칩 구성" mine={comp.isSpec ? "제원 입력" : `${U.name} × ${nUnits}`} refV="교체형 (벤더 중립)" />
            </div>
            <div>
              <p style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.7 }}>
                가장 큰 간극은 <strong>효율(컴퓨트 kW/t)</strong>입니다. 이 워크시트는 ECSS 개념설계 마진(30~40%)과
                보수적인 방열판 면밀도·구조 계수를 쓰므로 {fmt(kwPerTon, 1)} kW/t가 나오는 반면,
                AI1 공개 목표는 70 kW/t입니다. 그 차이를 좁히는 손잡이는 ⑤에 있습니다 —
                설계 성숙도를 Phase C/D로, 방열판 면밀도를 2 kg/m² 근처로, 어레이 비출력을 300 W/kg으로
                올리면 이 설계도 AI1급 효율에 접근하는지 확인할 수 있습니다.
              </p>
              <p className="mt-3" style={{ fontSize: 12.5, color: C.ink2, lineHeight: 1.7 }}>
                반대로 <strong>AI1 제원을 그대로 넣고</strong> 이 워크시트의 서비스·통신 계산(②·③)을 돌려보면,
                120 kW급 위성 1기가 감당하는 사용자 규모와 필요한 ISL·릴레이가 나옵니다.
              </p>
              <button onClick={applyAI1} className="px-4 py-2.5 mt-4"
                style={{ background: C.hot, border: `1px solid ${C.hot}`, color: "#fff",
                  fontFamily: MONO, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                ⟳ AI1 제원으로 ①을 설정하고 계산
              </button>
            </div>
          </div>
        </Panel>

        {/* ═══ ⑤ 참고: 전력·열·무게 ═══ */}
        <Panel eyebrow="⑤ 참고: 전력 · 열 · 무게" title="이 설계가 물리적으로 성립하는가 (산출 결과만 참고)"
          flow="입력: ①의 전력·③의 통신 구성 → 출력: 태양전지판·방열판·발사질량 — 위 결과의 성립 조건"
          accent={C.bus} style={{ marginBottom: 18 }}>
          <div className="grid gap-6 lg:grid-cols-3">
            <div>
              <Eyebrow color={C.power}>전력 예산 (CBE → MEV)</Eyebrow>
              <div className="mt-2">
                <BudgetTable rows={pw.items} unit="W" fmtV={(v) => fmt(v, 0)}
                  total={{ k: "부하 소계", cbe: pw.cbeSum, mev: pw.mevSum }} />
                <Row k={`시스템 마진 +${P.sys}% · 배전 손실`} v={fmt(pw.busInput, 0)} u="W" dim />
                <Row k="태양전지판 요구출력" v={kW(pw.Psa)} accent={C.power} />
                <Row k="어레이 면적 / 질량" v={`${fmt(pw.saArea, 0)} m² / ${fmt(pw.saMass, 0)} kg`} dim />
                <Row k="배터리" v={`${fmt(pw.battWh / 1000, 1)} kWh / ${fmt(pw.battMass, 0)} kg`} dim />
              </div>
              <div className="mt-3">
                <Choice label="설계 성숙도" cols={1} value={phase} onChange={setPhase}
                  options={Object.entries(PHASES).map(([k, p]) => ({ key: k, label: p.name, sub: `장비 ${p.eqAB}/${p.eqC}/${p.eqD}% · 시스템 ${p.sys}%` }))} />
              </div>
            </div>
            <div>
              <Eyebrow color={C.hot}>열 · 궤도</Eyebrow>
              <div className="mt-2">
                <Row k="배출 열량 (= 소비 전력)" v={kW(th.Q)} accent={C.hot} />
                <Row k="방열판 면적" v={fmt(th.area, 0)} u="m²" accent={C.hot} />
                <Row k="방열계 질량" v={fmt(th.mass + th.loopMass, 0)} u="kg" dim />
                <Row k="궤도 주기 / 일조율" v={`${fmt(orb.T, 0)}분 / ${fmt(orb.sunFrac * 100, 0)}%`} dim />
              </div>
              <div className="mt-3">
                <Choice label="궤도 유형" cols={1} value={orbitType}
                  onChange={(k) => { setOrbitType(k); setBetaAng(ORBIT_TYPES[k].beta); }}
                  options={Object.entries(ORBIT_TYPES).map(([k, o]) => ({ key: k, label: o.name, sub: o.desc }))} />
                <Slider label="고도" value={alt} onChange={setAlt} min={350} max={1200} step={10} unit="km" />
                <Slider label="임무 수명" value={life} onChange={setLife} min={1} max={10} unit="년" />
              </div>
              {!isFinite(th.area) && (
                <div className="p-3 mt-2" style={{ background: "#F6E3DE", border: `1px solid ${C.warn}` }}>
                  <span style={{ fontSize: 12, color: C.warn }}>순 방열량 ≤ 0 — 방열판 작동 온도를 올리거나 자세를 바꾸세요.</span>
                </div>
              )}
            </div>
            <div>
              <Eyebrow>질량 · 발사 (ECSS)</Eyebrow>
              <div className="mt-2">
                <Row k="장비 소계 (MEV)" v={fmt(ms.eqMEV, 0)} u="kg" dim />
                <Row k="하네스 + 구조 + 시스템 마진" v={fmt(ms.dry - ms.eqMEV, 0)} u="kg" dim />
                <Row k="건조질량" v={fmt(ms.dry, 0)} u="kg" accent={C.compute} />
                <Row k={`추진제 (Δv ${fmt(ms.dV, 0)} m/s)`} v={fmt(ms.prop, 0)} u="kg" dim />
                <Row k="발사질량" v={`${fmt(ms.wet, 0)} kg (${fmt(ms.wet / 1000, 1)} t)`} accent={C.compute} />
                <Row k="전개 면적 (방열+어레이)" v={fmt(ms.deployed, 0)} u="m²" dim />
                <Row k={`발사 (${con.L.name}, ${nSats.toLocaleString("ko-KR")}기)`}
                  v={con.per >= 1 ? `${fmt(con.launches, 0)}회 · $${fmt(con.cost, 1)}B` : "1기가 발사능력 초과"} dim
                  accent={con.per >= 1 ? undefined : C.warn} />
              </div>
              <Details label="세부 가정 조정 (질량표 · 발사체 · 셀 효율 등)">
                <BudgetTable rows={ms.eq} unit="kg" fmtV={(v) => fmt(v, 0)}
                  total={{ k: "장비 소계", cbe: ms.eqCBE, mev: ms.eqMEV }} />
                <div className="mt-3">
                  <Choice label="발사체" cols={2} value={launcherKey} onChange={setLauncherKey}
                    options={Object.entries(LAUNCHERS).map(([k, l]) => ({ key: k, label: l.name, sub: `${(l.cap / 1000).toFixed(0)} t · $${l.kgCost}/kg` }))} />
                  <Slider label="방열판 작동 온도" value={radT} onChange={setRadT} min={0} max={120} step={5} unit="°C" />
                  <Choice label="방열판 자세" cols={1} value={radAtt} onChange={setRadAtt}
                    options={Object.entries(RAD_ATT).map(([k, v]) => ({ key: k, label: v.name }))} />
                  <label className="flex items-start gap-2 mb-3 cursor-pointer">
                    <input type="checkbox" checked={shedLoad} onChange={(e) => setShedLoad(e.target.checked)} style={{ accentColor: C.compute, marginTop: 2 }} />
                    <span style={{ fontSize: 12, color: C.ink2 }}>식(蝕) 구간 컴퓨트 차단 (배터리 절감 ↔ 가동률 하락)</span>
                  </label>
                  <Slider label="셀 효율" value={cellEff} onChange={setCellEff} min={20} max={35} unit="%" />
                  <Slider label="연간 방사선 열화" value={degPerYr} onChange={setDegPerYr} min={0.5} max={5} step={0.25} unit="%/년" dec={2} />
                  <Slider label="어레이 비출력" value={saWkg} onChange={setSaWkg} min={100} max={350} step={10} unit="W/kg" />
                  <Slider label="방전심도 DOD" value={dod} onChange={setDod} min={10} max={60} unit="%" />
                  <Slider label="배터리 비에너지" value={battWhKg} onChange={setBattWhKg} min={120} max={280} step={10} unit="Wh/kg" />
                  <Slider label="PCDU 효율" value={pcduEff} onChange={setPcduEff} min={85} max={97} unit="%" />
                  <Slider label="방열판 면밀도" value={radKgM2} onChange={setRadKgM2} min={1.5} max={10} step={0.5} unit="kg/m²" />
                  <Slider label="핀 효율" value={finEff} onChange={setFinEff} min={60} max={95} unit="%" />
                  <Slider label="전력-주파수 지수 α" value={alphaVF} onChange={setAlphaVF} min={1.8} max={3.2} step={0.1} unit="" dec={1} />
                  <Slider label="정적 전력 비중" value={staticFrac} onChange={setStaticFrac} min={10} max={50} unit="%" />
                  <Slider label="전개면 램 투영 비율" value={projFrac} onChange={setProjFrac} min={5} max={100} unit="%" />
                  <Slider label="AOCS 기본 전력" value={aocsBase} onChange={setAocsBase} min={100} max={3000} step={50} unit="W" />
                  <Slider label="OBDH 전력" value={obdhW} onChange={setObdhW} min={100} max={3000} step={50} unit="W" />
                </div>
              </Details>
            </div>
          </div>
        </Panel>

        {/* Method */}
        <Panel eyebrow="Method" title="계산 체계 요약" accent={C.ink3}>
          <div className="grid gap-x-8 gap-y-1 sm:grid-cols-2">
            {[
              ["활용률", "실시간 추론이 쓰는 연산 = 동시세션 × 세션속도 × 토큰당 연산. 남는 연산은 배치·학습·관측 처리로 채우거나 전력 캡 인하 근거로 사용"],
              ["통신 구조", "TT&C만 RF 직접. 서비스 트래픽 = 토큰(출력+입력 × 3 B × 프로토콜 배수) + 에이전트 웹 검색 유입 + 멀티미디어 출력 → 광 ISL → 릴레이 LEO → 지상"],
              ["ISL 기준 설계", "위성당 4터미널 고정: 릴레이행 2(오프로딩 전담) + SDC 링 전·후 2(학습·관측 전용). 판정 = 지상행 ≤ 릴레이행 2기 × 점유율, 링 트래픽 ≤ 링 2기 × 점유율"],
              ["릴레이 사이징", "링크는 릴레이 간 분할 불가 → 릴레이 1기 수용 링크 = min(포트 수, ⌊실효용량 ÷ 링크당 트래픽⌋). 필요 릴레이 = ⌈SDC수 × 동시링크 ÷ 수용 링크⌉ — 용량·링크 제약이 결합된 산식"],
              ["AI1 비교", "2026-06-09 공개치(120/150 kW, 600 km, 70 kW/t, 70 m 윙스팬, GB300 1랙 등가) 기준. 질량·연산·HBM은 등가 랙에서 추정"],
              ["마진", "ECSS — 장비 성숙도별 + 시스템 20%, 컴퓨팅 마진 100% (개념설계 권고)"],
              ["전력·열·질량", "SMAD 어레이 사이징, 복사 열평형(2εσT⁴ − 지구 IR·알베도), ECSS 질량 체계"],
              ["미반영", "릴레이 성좌의 궤도 커버리지 기하, ISL 포인팅·획득 시간, 지연(latency), 페어링 체적, 궤도 조립"],
            ].map(([k, v], i) => (
              <div key={i} className="flex gap-3 py-1" style={{ borderBottom: `1px dotted ${C.rule}` }}>
                <span style={{ fontFamily: MONO, fontSize: 10, color: C.ink3, minWidth: 68, paddingTop: 2 }}>{k}</span>
                <span style={{ fontSize: 11.5, color: C.ink2, lineHeight: 1.5 }}>{v}</span>
              </div>
            ))}
          </div>
        </Panel>

        <footer className="mt-6 pt-4" style={{ borderTop: `1px solid ${C.rule}`, fontFamily: MONO, fontSize: 10, color: C.ink3, letterSpacing: "0.08em" }}>
          Phase 0/A 규모 산정용 · 서비스·통신 중심 재구성 v3 · 상세 설계 검증 대체 불가
        </footer>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<SDCServiceCommSimulator />);
</script>
</body>
</html>
